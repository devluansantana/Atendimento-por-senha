services:
  dev:
    build: .
    image: atendimento-senhas-dev
    volumes:
      - .:/app
    working_dir: /app
    # Mantem o container ligado para abrir varios terminais nele
    # (um para o cliente, outro para o atendente) com "docker compose exec".
    command: sleep infinity
    init: true
    # Necessario para o gdb (depurador) e para o AddressSanitizer funcionarem
    # dentro do container. E um ambiente de desenvolvimento local.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
